name: PR CI

# The required check gating merge/auto-merge of every PR.
#
# This chart had a 19-file `helm unittest` suite and six values fixtures under
# tests/ that nothing ever ran: the repo's only workflows were release-please,
# release, and renovate, so every PR -- including Renovate's -- merged with
# zero validation. That is the gate Renovate automerge needs (renovate.json
# automerges patch/minor/digest), and without it GitHub has no required check
# to hold an auto-merge on, so updates to a chart the cluster deploys from
# would land unverified and go straight out through release.yml.
#
# Three layers, cheapest first:
#   1. helm lint    -- chart metadata and template syntax, per values fixture.
#   2. helm unittest -- the existing tests/ suite (the real behavioral check).
#   3. helm template + kubeconform -- renders each fixture and validates the
#      output against upstream Kubernetes schemas plus the Gateway API and
#      cert-manager CRD schemas, so a manifest this chart emits can't be
#      structurally invalid on the cluster.
#
# Runs on every PR with no `paths:` filter, matching
# free-tier-oracle-cloud-k8s: a filtered trigger would leave this required
# check permanently "expected" on a PR that touches nothing it watches, and
# block merge forever.
#
# `-skip CustomResourceDefinition` is not needed here (this chart installs no
# CRDs) but custom-resource *instances* it does render -- Certificate,
# HTTPRoute, ReferenceGrant, ServiceMonitor -- are validated against the
# CRDs-catalog schemas below, which is the point of the schema-location flag.
#
# Hardening, same discipline as the sibling repos: every `uses:` SHA-pinned,
# kubeconform checksum-verified, the helm-unittest plugin pinned to a tag, and
# the CRD schema catalog pinned to a commit SHA rather than `main` so a
# compromised upstream can't weaken a schema into a false PASS.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Validating with a current Helm is the more useful check, since
          # ArgoCD renders this chart with its own bundled Helm rather than
          # the one release.yml packages with. Matches release.yml's pin.
          version: v4.2.3

      - name: helm lint (every values fixture)
        run: |
          set -euo pipefail
          helm lint .
          for fixture in tests/values/*.yaml; do
            echo "::group::helm lint -f ${fixture}"
            helm lint . --values "$fixture"
            echo "::endgroup::"
          done

      - name: helm unittest (tests/)
        env:
          # Pinned rather than floating: the plugin executes as part of a
          # required merge gate, so an unpinned install is remote code
          # deciding whether a PR can auto-merge.
          HELM_UNITTEST_VERSION: "v1.1.2"
        run: |
          set -euo pipefail
          # Helm v4 verifies plugin signatures by default and refuses to
          # install a plugin whose source doesn't support it ("plugin source
          # does not support verification") -- helm-unittest publishes no
          # provenance/signature, so verification must be explicitly skipped.
          # The plugin itself is still pinned to an exact version above and
          # its release tarball checksum-verified by Helm, so this isn't
          # trusting an unpinned or unverified download -- it's opting out of
          # a signature scheme the upstream project doesn't participate in.
          helm plugin install https://github.com/helm-unittest/helm-unittest \
            --version "$HELM_UNITTEST_VERSION" \
            --verify=false
          helm unittest .

      - name: Install kubeconform (pinned, checksum-verified)
        env:
          KUBECONFORM_VERSION: "0.8.0"
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
        run: |
          set -euo pipefail
          archive="kubeconform-linux-amd64.tar.gz"
          curl -sSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${archive}"
          echo "${KUBECONFORM_SHA256}  ${archive}" | sha256sum -c -
          install_dir="${RUNNER_TEMP}/kubeconform"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" kubeconform
          rm -f "$archive"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: helm template + kubeconform (every values fixture)
        env:
          # Matches the OKE cluster this chart deploys onto -- see
          # free-tier-oracle-cloud-k8s terraform/oci-containerengine-cluster.tf
          # kubernetes_version. Chart.yaml's kubeVersion floor is >=1.27.0-0,
          # but validating against what actually runs is the useful check.
          KUBERNETES_VERSION: "1.36.0"
          # Gateway API + cert-manager + Prometheus-operator CRD schemas, for
          # the custom-resource instances this chart renders. Pinned to the
          # same commit SHA free-tier-oracle-cloud-k8s uses.
          CRD_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/34cef0fc2698bbb611f475515e555a2d7ca85b6c/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
        run: |
          set -uo pipefail
          failed=0
          for fixture in tests/values/*.yaml; do
            echo "::group::${fixture}"
            # kubeconform requires a .yaml/.yml/.json suffix on the path it is
            # given -- an extensionless temp file is silently treated as "0
            # files" (no error, no output) instead of failing loudly.
            rendered="$(mktemp --suffix=.yaml)"
            if helm template release-name . --values "$fixture" > "$rendered" \
              && kubeconform \
                   -strict \
                   -summary \
                   -kubernetes-version "$KUBERNETES_VERSION" \
                   -schema-location default \
                   -schema-location "$CRD_SCHEMA_LOCATION" \
                   "$rendered"
            then
              echo "OK: $fixture"
            else
              echo "FAILED: $fixture"
              failed=1
            fi
            rm -f "$rendered"
            echo "::endgroup::"
          done
          exit "$failed"
