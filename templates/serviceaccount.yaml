{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
# Mirrors the pod-level automountServiceAccountToken as defense in depth:
# the pod spec's own explicit value always wins for this chart's pods, but any
# *other* pod reusing this SA inherits the same no-token default.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
metadata:
  name: {{ include "generic-app-chart.serviceAccountName" . }}
  labels:
    {{- include "generic-app-chart.labels" . | nindent 4 }}
  {{- with (include "generic-app-chart.serviceAccountAnnotations" .) }}
  annotations:
    {{- nindent 4 . }}
  {{- end }}
{{- end }}
