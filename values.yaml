# Default values for generic-app-chart.
# This is a YAML-formatted file — see README.md for the full reference.

# Derived names default to "<release>-<chart>" (or just "<release>" when
# the release name already contains the chart name). Override either to
# control the name every resource in this chart is rendered under.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  # Defaults to .Chart.AppVersion when unset.
  tag: ""
  # Optional immutable digest ("sha256:..."). When set, the image is pinned
  # by digest — "<repository>@<digest>" — and `tag` is ignored, so the
  # deployed bits can never drift under a re-pushed tag.
  digest: ""
  pullPolicy: IfNotPresent

# References existing (referenced) image-pull Secret(s) by name for
# private-registry pulls — this chart never creates the Secret being
# referenced here. Omitted from the pod spec entirely when empty.
#   imagePullSecrets:
#     - name: existing-registry-secret
imagePullSecrets: []

# Omitted from the container spec when unset.
command: []
args: []

# Plain and valueFrom-sourced entries — this is the native Kubernetes
# EnvVar shape, so both forms live in one list:
#   env:
#     - name: LOG_LEVEL
#       value: debug
#     - name: DB_PASSWORD
#       valueFrom:
#         secretKeyRef:
#           name: existing-db-secret   # a referenced Secret — never created by this chart
#           key: password
env: []

# References an existing Secret/ConfigMap by name — this chart never
# creates the Secret/ConfigMap being referenced here.
#   envFrom:
#     - secretRef:
#         name: existing-app-secret
#     - configMapRef:
#         name: existing-app-config
envFrom: []

# Each of livenessProbe/readinessProbe/startupProbe accepts three
# forms, tried in this order:
#   1. A raw native Probe block — supports httpGet/tcpSocket/exec/grpc
#      exactly as the Kubernetes Probe spec does — rendered verbatim,
#      overriding the shorthand/default below.
#   2. A shorthand: {path, port} for an HTTP probe, or {port} alone for a
#      TCP probe; any other native Probe field (initialDelaySeconds,
#      periodSeconds, ...) may be added alongside and passes through as-is.
#        readinessProbe:
#          path: /healthz
#          port: 8080
#          initialDelaySeconds: 5
#   3. Empty (the {} default) — omitted, except readinessProbe, which falls
#      back to a tcpSocket check on the primary service port
#      (service.ports[0].targetPort) when no readiness probe is configured.
#      livenessProbe/startupProbe never get a synthesized default — a bad
#      default liveness probe would cause restart loops, so both stay
#      strictly opt-in.
livenessProbe: {}
readinessProbe: {}
startupProbe: {}

# Ignored (forced to 1) when persistence.enabled — see the persistence handling in deployment.yaml.
replicaCount: 1

# Bounds how many old ReplicaSets Kubernetes retains for rollback;
# omitted (cluster default of 10 applies) when unset.
revisionHistoryLimit: ""

# Minimum seconds a new pod must run without crashing before it counts
# as available; omitted (defaults to 0) when unset.
minReadySeconds: ""

# Configurable RollingUpdate bounds. Ignored — the Deployment stays
# `strategy: Recreate` — whenever persistence.enabled (that setting always wins).
updateStrategy:
  maxSurge: ""
  maxUnavailable: ""

# No pod automatically mounts its ServiceAccount token unless opted in.
# Mirrored onto the ServiceAccount resource itself (serviceaccount.yaml) as
# defense in depth, so any other pod reusing this SA inherits the same default.
automountServiceAccountToken: false

# Kubernetes injects legacy Docker-link-style env vars ({SVC}_SERVICE_HOST,
# ...) for every Service in the namespace into every pod by default — clutter
# at best, an information leak and env-size problem at worst. Off by default;
# set true for legacy apps that discover services through those vars.
enableServiceLinks: false

# Seconds Kubernetes waits after sending SIGTERM before force-killing the
# pod; override for apps that need longer (or shorter) to drain in-flight
# work before exit.
terminationGracePeriodSeconds: 30

# Sleep-drain shorthand — set `preStop.sleepSeconds` to render a
# container lifecycle.preStop exec `sleep <n>` hook, giving in-flight
# connections time to drain before SIGTERM is sent. Ignored whenever
# `lifecycle` below is set.
preStop: {}
#   preStop:
#     sleepSeconds: 5

# Raw Lifecycle passthrough — rendered verbatim exactly as the
# Kubernetes container Lifecycle spec (preStop/postStart), taking precedence
# over preStop.sleepSeconds above. No `lifecycle` block is rendered on the
# container when neither this nor preStop.sleepSeconds is set.
#   lifecycle:
#     preStop:
#       exec:
#         command: ["/bin/sh", "-c", "sleep 5 && custom-cleanup.sh"]
lifecycle: {}

# Pod-level strict security defaults (_security.tpl). Every field below
# is independently overridable — set only the field you need to change,
# the rest keep their restricted-PSA-compliant default.
podSecurityContext: {}
# podSecurityContext:
#   runAsUser: 1000        # override just this field; runAsGroup/fsGroup/etc. stay at their defaults

# Container-level strict security defaults (_security.tpl), merged the
# same way as podSecurityContext.
containerSecurityContext: {}
# containerSecurityContext:
#   readOnlyRootFilesystem: false   # e.g. for an app that writes outside /tmp

# Additional writable emptyDir mounts beyond the automatic /tmp one that
# readOnlyRootFilesystem provisions.
#   extraEmptyDirs:
#     - name: cache
#       mountPath: /var/cache/app
#       sizeLimit: 256Mi   # optional
extraEmptyDirs: []

# Arbitrary additional volumes/volumeMounts beyond the automatic /tmp,
# extraEmptyDirs, and persistence PVC — e.g. mounting a referenced Secret or
# ConfigMap. Native Kubernetes Volume/VolumeMount shapes, assembled through
# the same _volumes.tpl partial as the sources above so they all coexist; the
# `name` in each extraVolumes entry must match the corresponding
# extraVolumeMounts entry.
#   extraVolumes:
#     - name: tls-certs
#       secret:
#         secretName: existing-tls-secret   # a referenced Secret — never created by this chart
#   extraVolumeMounts:
#     - name: tls-certs
#       mountPath: /etc/tls
#       readOnly: true
extraVolumes: []
extraVolumeMounts: []

# Native Container entries rendered verbatim. initContainers run before the
# app container (migrations, permission fixups); extraContainers run alongside
# it as sidecars (log shippers, proxies). Neither inherits the chart's
# container securityContext defaults — set securityContext explicitly on each
# entry, since a restricted-PSA namespace (see `namespace` below) will reject
# containers without one.
#   initContainers:
#     - name: migrate
#       image: ghcr.io/example/app:1.0.0
#       command: ["/app/migrate"]
#       securityContext: {...}
initContainers: []
extraContainers: []

# Requests AND limits are always set; override wholesale for a hungrier app.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Generic metadata passthrough. podAnnotations/podLabels apply to the pod
# template only; commonLabels/commonAnnotations apply to every resource this
# chart renders. All four are merged with (and always overridden by) this
# chart's managed labels/annotations — selector labels and the checksum/config
# annotation can never be clobbered by a user-supplied key.
podAnnotations: {}
podLabels: {}
commonLabels: {}
commonAnnotations: {}

# Native nodeSelector/tolerations/priorityClassName/
# topologySpreadConstraints/affinity passthrough — each omitted from the pod
# spec unless set. When affinity is left unset and replicaCount > 1, the
# chart injects a default soft (preferred) pod anti-affinity across
# kubernetes.io/hostname instead (see deployment.yaml) — set affinity
# explicitly to opt out of that default.
nodeSelector: {}
tolerations: []
priorityClassName: ""
topologySpreadConstraints: []
affinity: {}

# A dedicated ServiceAccount per app; set create: false and name to reuse
# an existing one instead.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Opt-in Namespace resource for the "one app per namespace" model: renders
# the release namespace itself, labeled with Pod Security Admission levels so
# the chart's restricted-PSA pod defaults are *enforced* at the namespace
# boundary, not just rendered. Off by default because ownership of an
# already-existing namespace can't be assumed (plain `helm install
# --create-namespace` and pre-created namespaces would conflict); turn it on
# when this release is what defines the namespace — e.g. an ArgoCD Application
# syncing into its own namespace. Note that `helm uninstall` then deletes the
# namespace and everything in it.
namespace:
  create: false
  # Rendered as pod-security.kubernetes.io/<key>: <value> labels. Set a level
  # to "" to omit that mode; keys like enforce-version pass through the same
  # way.
  podSecurityStandards:
    enforce: restricted
    audit: restricted
    warn: restricted
  # Extra labels/annotations for the Namespace only, merged with (and
  # overridden by) commonLabels/commonAnnotations and the PSA labels above.
  labels: {}
  annotations: {}

# Maps declared ports to the pod's container ports (see deployment.yaml,
# which renders container ports from this same list).
service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

# Additional annotations for the Service only, merged with
# commonAnnotations (serviceAnnotations wins on conflict, being the more
# specific of the two).
serviceAnnotations: {}

# Rendered into a ConfigMap when non-empty; omitted entirely otherwise.
config: {}

# Adds a `checksum/config` annotation to the pod template, derived from the
# `config` map above, so that editing config rolls the pods.
#
# Off by default, because under ArgoCD an always-on checksum costs more than
# it gives: most apps here either hot-reload their config or read it only at
# startup on a schedule where an operator-triggered restart is fine, and the
# annotation makes every config edit a full rollout whether or not the app
# needed one. Turn it on per-app when a config change genuinely must restart
# the process to take effect.
#
# Not a sub-key of `config` on purpose: every key under `config` becomes
# ConfigMap data, so a flag there would render as app configuration.
#
# Only meaningful when `config` is non-empty — with no ConfigMap there is
# nothing to checksum, and the annotation is omitted regardless of this flag.
configChecksumAnnotation: false

# An RWO Longhorn PVC. Enabling it forces the Deployment to
# `strategy: Recreate` + `replicas: 1` (see deployment.yaml) since a Longhorn
# RWO volume cannot be multi-attached during a rollout, and it must never be
# paired with autoscaling — hpa.yaml gates on persistence.enabled the same
# way this chart's replica logic does.
persistence:
  enabled: false
  size: 1Gi
  storageClass: longhorn
  mountPath: /data
  existingClaim: ""

# Cluster-only by default (routing.enabled: false) — no
# HTTPRoute/Certificate/ReferenceGrant renders until routing is turned on (see
# the routing.enabled gate in each of those templates). When enabled, the
# chart exposes this app's Service through the lab's one shared Traefik
# Gateway and issues it a letsencrypt certificate.
routing:
  enabled: false
  # Hostname(s) the HTTPRoute matches and the Certificate's dnsNames are
  # derived from.
  hostnames: []
  # ParentRef to the shared Gateway — name/namespace/sectionName are all
  # overridable per app; there is exactly one Gateway on this lab.
  gateway:
    name: shared-gateway
    # Defaults to this release's namespace when unset.
    namespace: ""
    # Optional; omitted from the parentRef when unset (matches any listener).
    sectionName: ""
  # TLS is on by default whenever routing is enabled — opt out per app if
  # a route genuinely needs to stay HTTP-only.
  tls:
    enabled: true
    issuerRef:
      name: letsencrypt
      kind: ClusterIssuer
    # Defaults to "<fullname>-tls" when unset.
    secretName: ""

# Opt-in HPA. Mutually exclusive with persistence.enabled — a Longhorn
# RWO volume can only be attached to one pod, so the chart suppresses the HPA
# (and keeps the Deployment's static replicas) whenever persistence is on,
# regardless of this flag (see deployment.yaml/hpa.yaml).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  # Omitted from the HPA's metrics when unset.
  targetMemoryUtilizationPercentage: ""
  # Native HorizontalPodAutoscalerBehavior passthrough (scaleUp/scaleDown
  # policies and stabilization windows), rendered verbatim; omitted when empty.
  #   behavior:
  #     scaleDown:
  #       stabilizationWindowSeconds: 300
  behavior: {}

# On by default, and safe to leave on: the PDB only renders when the
# effective replica count is > 1 (pdb.yaml), so single-replica apps never get
# a budget that would deadlock a node drain. minAvailable/maxUnavailable are
# mutually exclusive; set maxUnavailable to use it instead of the default
# minAvailable. Set enabled: false to opt out entirely.
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""
  # Lets the eviction API remove pods that are Running-but-not-Ready even
  # when the budget is exhausted, so a crash-looping app can't wedge a node
  # drain forever (needs k8s >=1.27, this chart's floor). Set "" to omit.
  unhealthyPodEvictionPolicy: AlwaysAllow

# Opt-in observability surface, off by default. Scrape annotations
# render on the pod template via the generic podAnnotations merge mechanism
# (_metadata.tpl); the ServiceMonitor (monitoring.coreos.com/v1,
# templates/servicemonitor.yaml) requires the prometheus-operator CRDs to
# already be installed cluster-side.
metrics:
  scrape:
    enabled: false
    # Port Prometheus scrapes /metrics from — usually a container port
    # already declared under service.ports.
    port: 9090
    path: /metrics
  serviceMonitor:
    enabled: false
    # Must match a port name already declared under service.ports; the
    # ServiceMonitor selects this app's Service by that named port.
    port: metrics
    path: /metrics
    # Omitted from the ServiceMonitor endpoint when unset (falls back to the
    # Prometheus Operator's own global scrape interval).
    interval: ""

# Default-deny-ingress NetworkPolicy, on by default. The allowed ingress
# sources are derived from what the app actually enables:
#   - pods in this app's own namespace (allowSameNamespace, the
#     one-app-per-namespace model's intra-app traffic);
#   - the gateway namespace/pods, only while routing.enabled — a cluster-only
#     app never needs the gateway to reach it;
#   - the monitoring namespace, only while the metrics surface
#     (metrics.scrape or metrics.serviceMonitor) is enabled;
#   - anything listed under additionalIngress.
# Everything else is denied. Egress stays unrestricted until either
# restrictEgress is set or additionalEgress rules are supplied; once egress
# restriction is active, DNS to kube-dns is allowed automatically
# (allowDNS) so a locked-down app can still resolve names.
networkPolicy:
  enabled: true
  # Allow all pods in this app's own namespace to reach it.
  allowSameNamespace: true
  gateway:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: traefik
    # Optional; narrows the allow rule to specific pods within the gateway
    # namespace when set.
    podSelector: {}
  # Where Prometheus scrapes from; only rendered while the metrics surface is
  # enabled. podSelector optionally narrows it, like gateway.podSelector.
  monitoring:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
  # Native NetworkPolicyIngressRule entries appended to the derived allowances
  # above, e.g. to let one specific sibling app in:
  #   additionalIngress:
  #     - from:
  #         - namespaceSelector:
  #             matchLabels:
  #               kubernetes.io/metadata.name: other-app
  additionalIngress: []
  # Default-deny egress too (plus the DNS carve-out below and any
  # additionalEgress). Off by default — most apps need to reach *something*,
  # and an empty egress allowlist would break them silently.
  restrictEgress: false
  # While egress restriction is active, keep DNS to kube-system's kube-dns
  # allowed automatically.
  allowDNS: true
  # Native NetworkPolicyEgressRule entries. Supplying any activates egress
  # restriction just like restrictEgress does:
  #   additionalEgress:
  #     - to:
  #         - namespaceSelector:
  #             matchLabels:
  #               kubernetes.io/metadata.name: database
  #       ports:
  #         - protocol: TCP
  #           port: 5432
  additionalEgress: []
